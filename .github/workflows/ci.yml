name: studiographene-ci

on:
  pull_request: { types: [opened, synchronize, reopened, closed] }
  issue_comment:

jobs:
  call-workflow:
    # Skip CI on PRs opened from forks of this repo. Once the repo is public,
    # external contributors should be able to open PRs without their CI runs
    # sending coverage analytics back to Studio Graphene's internal Pulse
    # pipeline. Internal PRs (head and base in the same repo) and issue-
    # comment events still run normally.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: studiographene/github-action-workflows/.github/workflows/nodejs-ci.yml@master
    secrets: inherit
    with:
      package_manager: pnpm
      build_command: pnpm run build
      lint_command: pnpm run lint
      excluded_jobs: docker
      run_dev_test: true
      dev_test_branch: master
      send_dev_test_coverage_report_to_pulse: true
      dev_test_coverage_report_directory: coverage
